<!DOCTYPE html>
<html>
<head>
<title>AI Healthcare Chatbot</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#e3f2fd,#f1f8e9);
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
} 

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#2e7d32;
  padding:15px 40px;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:22px;
  font-weight:600;
  animation:slideIn 1s ease;
}
.logo {
    font-size: 20px;
    font-weight: 600;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
}
.plus {
    width: 32px;
    height: 32px;
    background:white;
    color: black;
    font-weight: bold;
    font-size: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;  /* ye circle banata hai */
}

.nav-links a{
  color:white;
  text-decoration:none;
  margin-left:20px;
  position:relative;
  font-weight:500;
  transition:0.3s;
}

.nav-links a::after{
  content:"";
  width:0%;
  height:2px;
  background:white;
  position:absolute;
  left:0;
  bottom:-5px;
  transition:0.3s;
}

.nav-links a:hover::after{
  width:100%;
}

.nav-links a:hover{
  transform:scale(1.1);
}

@keyframes slideIn{
  from{
    opacity:0;
    transform:translateY(-20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* MAIN LAYOUT */
.main{
  display:flex;
  height:calc(100vh - 70px);
}

/* LEFT SIDE */
.left{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* RIGHT SIDE */
.right{
  flex:1;
  background:#e8f5e9;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.right img{
  width:300px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%{ transform:translateY(0px);}
  50%{ transform:translateY(-15px);}
  100%{ transform:translateY(0px);}
}

.right h2{
  color:#2e7d32;
}

/* CHAT BOX */
.chat-container{
  width:90%;
  max-width:450px;
  background:white;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
.header{
  background:#2e7d32;
  color:white;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:35px;
  height:35px;
  border-radius:50%;
}

/* MESSAGES */
.messages{
  height:350px;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.message{
  padding:12px 16px;
  border-radius:20px;
  margin:6px 0;
  max-width:75%;
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.user{
  background:#c8e6c9;
  align-self:flex-end;
}

.bot{
  background:#f1f1f1;
  align-self:flex-start;
}

/* INPUT AREA */
.input-area{
  display:flex;
  align-items:center;
  padding:10px;
  border-top:1px solid #ddd;
  gap:5px;
}

.input-area input{
  flex:1;
  padding:12px;
  border-radius:20px;
  border:1px solid #ccc;
}

/* BUTTON */
.send-btn{
  background:#2e7d32;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:50%;
  cursor:pointer;
  transition:0.3s;
}

.send-btn:hover{
  background:#1b5e20;
  transform:scale(1.1);
}

button{
  border:none;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  background:#e8f5e9;
  transition:0.3s;
}

button:hover{
  background:#c8e6c9;
  transform:scale(1.1);
}

.auth-cta{
  padding:18px 20px 22px;
  text-align:center;
  border-top:1px solid #e5e5e5;
  background:#f9fff9;
}

.auth-cta p{
  margin:0 0 14px;
  color:#2e7d32;
  font-weight:600;
}

.auth-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.auth-link{
  display:inline-block;
  padding:10px 18px;
  border-radius:999px;
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}

.auth-link.login{
  background:#2e7d32;
  color:white;
}

.auth-link.register{
  background:#e8f5e9;
  color:#1b5e20;
}

.auth-link:hover{
  transform:translateY(-2px);
}

/* RESPONSIVE */
@media(max-width:768px){
  .main{
    flex-direction:column;
  }
  .right{
    display:none;
  }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    
    <div class="logo">
    <span class="plus">+</span> HealthAI
</div>
  <div class="nav-links">
    <a href="firstpage.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="loginandregister.html">Login</a>
    <a href="loginandregister.html">Register</a>
    <a href="chat.html">Chat</a>
  </div>
</div>

<div class="main">

  <!-- LEFT CHAT -->
  <div class="left">
    <div class="chat-container">

      <div class="header">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png" class="avatar">
        <div>Healthcare Bot</div>
      </div>

      <div class="messages" id="chat"></div>

      <!-- QUICK BUTTONS -->
      <div class="suggestions" style="padding:10px;">
        <button onclick="quickMsg('Fever symptoms')">Fever</button>
        <button onclick="quickMsg('Headache solution')">Headache</button>
        <button onclick="quickMsg('Cold and cough')">Cold</button>
        <button onclick="quickMsg('Diet tips')">Diet</button>
      </div>

      <div class="input-area">
        <input type="text" id="input" placeholder="Type your question...">
        <button class="send-btn" onclick="send()">➤</button>
      </div>

      <div class="auth-cta">
        <p>Continue with the full chatbot experience.</p>
        <div class="auth-actions">
          <a class="auth-link login" href="loginandregister.html">Login</a>
          <a class="auth-link register" href="loginandregister.html">Register</a>
        </div>
      </div>

    </div>
  </div>

  <!-- RIGHT IMAGE -->
  <div class="right">
    <img src="https://technobrains.io/wp-content/uploads/2022/02/image-32-1024x1024.webp">
    <h2>CareAI 💙</h2>
  </div>

</div>

<script>
let count = 0;

document.getElementById("input").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    send();
  }
});

function quickMsg(text){
  document.getElementById("input").value = text;
  send();
}

function send(){
  let input = document.getElementById("input");
  let chat = document.getElementById("chat");

  if(input.value.trim() === "") return;

  chat.innerHTML += `<div class="message user">${input.value}</div>`;
  count++;

  let typing = document.createElement("div");
  typing.className = "message bot";
  typing.innerHTML = "Typing...";
  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

  setTimeout(()=>{

    typing.remove();

    if(count > 1){
      chat.innerHTML += `<div class="message bot">🔒 Please login to continue.</div>`;
      setTimeout(()=>{window.location.href="loginandregister.html";},2000);
      return;
    }

    chat.innerHTML += `<div class="message bot">😊 Stay hydrated and take proper rest. Consult doctor if needed.</div>`;
    chat.scrollTop = chat.scrollHeight;

  },1000);

  input.value="";
}
</script>

</body>
</html>
